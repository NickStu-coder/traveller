name: Docker
on:
  workflow_run:
    workflows: [CI, Car and shared travel workflows, Hotel integration, Desktop CI]
    types: [completed]
    branches: [main, traveller]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to publish after all required checks
        required: true
        default: traveller
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nickstu-coder/traveller
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  DOCKER_BUILD_SUMMARY: 'false'
jobs:
  resolve:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: read}
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {ref: '${{ github.workflow_sha }}'}
      - id: commit
        uses: actions/github-script@v9
        env:
          BUILD_REF: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.repos.getCommit({ owner, repo, ref: process.env.BUILD_REF });
            await require('./scripts/docker-publication.cjs').requireChecks({ github, owner, repo, sha: data.sha });
            core.setOutput('sha', data.sha);
  amd64:
    needs: resolve
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {ref: '${{ needs.resolve.outputs.sha }}'}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: COMMIT_SHA=${{ needs.resolve.outputs.sha }}
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache-amd64,mode=max
  arm64:
    needs: resolve
    runs-on: ubuntu-24.04-arm
    permissions: {contents: read, packages: write}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {ref: '${{ needs.resolve.outputs.sha }}'}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/arm64
          build-args: COMMIT_SHA=${{ needs.resolve.outputs.sha }}
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache-arm64
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache-arm64,mode=max
  merge:
    needs: [resolve, amd64, arm64]
    runs-on: ubuntu-latest
    concurrency: {group: traveller-image-publication, cancel-in-progress: false}
    permissions: {contents: read, packages: write, actions: read}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {ref: '${{ github.workflow_sha }}'}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.sha }}
          AMD64_DIGEST: ${{ needs.amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.arm64.outputs.digest }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = process.env.HEAD_SHA;
            await require('./scripts/docker-publication.cjs').requireChecks({ github, owner, repo, sha, attempts: 1 });
            await require('./scripts/docker-publication.cjs').publish({ github, owner, repo, sha,
              image: `ghcr.io/${process.env.IMAGE_NAME}`,
              digests: [process.env.AMD64_DIGEST, process.env.ARM64_DIGEST] });
      - name: Inspect published immutable reference
        run: docker buildx imagetools inspect ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.sha }}
